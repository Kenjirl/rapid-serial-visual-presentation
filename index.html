<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fast Read - RSVP</title>

        <!-- Website favicon -->
        <link rel="icon" type="image/png" sizes="32x32" href="public/icon/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="public/icon/favicon-16x16.png" />
        <link rel="icon" href="public/icon/favicon.ico" sizes="any" />
        <link rel="apple-touch-icon" sizes="180x180" href="public/icon/apple-touch-icon.png" />
        <link rel="manifest" href="public/icon/site.webmanifest" />

        <!-- Tema: dijalankan sebelum CSS agar halaman tidak berkedip putih saat reload -->
        <script>
            (function () {
                try {
                    var t = localStorage.getItem("rsvp_theme") || "system";
                    if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches))
                        document.documentElement.classList.add("dark");
                } catch (e) {}
            })();
        </script>

        <link rel="stylesheet" href="css/tailwind.css" />
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/dark.css" />

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;600&family=IBM+Plex+Sans:wght@400;600&family=Roboto+Mono:wght@400;600&family=Quicksand:wght@400;600&display=swap"
            rel="stylesheet" />

        <script src="https://kit.fontawesome.com/5b8fa639bb.js" crossorigin="anonymous"></script>
    </head>
    <body class="min-h-screen flex flex-col items-center text-cl-18181B">
        <!-- Spacer for header -->
        <div class="block w-full h-20"></div>
        
        <main class="w-full flex-1 flex flex-col items-center gap-8 px-4 pt-10 pb-10">
            <!-- RSVP stage: one column, 80% of screen width -->
            <section
                id="rsvpContainer"
                class="relative font-default w-[80vw] h-[50vh] flex items-center justify-center overflow-hidden">
                <p
                    id="rsvpWord"
                    aria-live="off"
                    class="inline-block whitespace-nowrap leading-none font-semibold tracking-tight text-cl-8A8A8E">
                    Ready
                </p>
            </section>

            <!-- Progress / scrubber -->
            <div class="w-full max-w-2xl flex flex-col gap-1">
                <input id="scrubber" type="range" min="1" max="1" value="1" step="1" disabled aria-label="Seek to word" class="scrubber" />
                <div class="flex justify-between text-sm text-cl-8A8A8E">
                    <span id="wordCounter">0 / 0</span>
                    <span id="textMeta">0 words</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="w-full max-w-2xl flex flex-col items-center gap-5">
                <div class="flex items-center gap-3">
                    <button id="restartBtn" aria-label="Restart" class="w-11 h-11 rounded-full border border-cl-D9D5D5 text-cl-2B2D31 hover:bg-cl-EDEAEA transition-colors">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                    <button id="playBtn" class="px-8 h-12 rounded-full bg-cl-2B2D31 text-cl-FFFAFA hover:bg-cl-18181B transition-colors">
                        <i class="fa-solid fa-play mr-2"></i><span>Start</span>
                    </button>
                    <button id="stopBtn" aria-label="Stop" class="w-11 h-11 rounded-full border border-cl-D9D5D5 text-cl-2B2D31 hover:bg-cl-EDEAEA transition-colors">
                        <i class="fa-solid fa-stop"></i>
                    </button>
                </div>

                <div class="w-full flex flex-col items-center gap-1">
                    <label for="speedSlider" class="text-sm text-cl-8A8A8E">
                        Speed: <span id="speedValue" class="text-cl-18181B font-semibold">300</span> WPM
                    </label>
                    <input id="speedSlider" type="range" min="100" max="900" step="10" value="300" class="w-full accent-cl-2B2D31" />
                </div>
            </div>

            <!-- Text input -->
            <section class="w-full max-w-2xl flex flex-col items-center gap-3">
                <div class="w-full flex flex-wrap items-center justify-between gap-2">
                    <div id="modeToggle" class="inline-flex p-1 rounded-full bg-cl-EDEAEA text-sm">
                        <button data-mode="plain" aria-pressed="true" class="px-4 py-1.5 rounded-full transition-colors">Plain text</button>
                        <button data-mode="novel" aria-pressed="false" class="px-4 py-1.5 rounded-full transition-colors">Novel (dialogue &amp; narration)</button>
                    </div>
                    <button id="sampleBtn" type="button" class="inline-flex items-center gap-2 px-3 py-1.5 text-sm rounded-full border border-cl-D9D5D5 text-cl-2B2D31 hover:bg-cl-EDEAEA transition-colors">
                        <i class="fa-solid fa-paste"></i> Use sample
                    </button>
                </div>
                <p id="novelHint" class="hidden w-full text-left text-xs text-cl-8A8A8E">
                    Text inside quotation marks (" ") is dialogue and can be colored. Everything else is narration and stays black.
                </p>
                <textarea
                    id="textInput"
                    class="w-full h-40 p-4 text-sm text-cl-18181B bg-white border border-cl-D9D5D5 rounded-2xl resize-none placeholder:text-cl-8A8A8E focus:outline-none focus:ring-2 focus:ring-cl-2B2D31/30"
                    placeholder="Paste or type the text you want to read..."></textarea>
                <div id="dialoguePanel" class="hidden w-full">
                    <div id="dialogueScroll" class="max-h-56 overflow-y-auto rounded-xl border border-cl-D9D5D5 bg-white">
                        <table class="w-full table-fixed text-xs text-cl-18181B">
                            <colgroup><col /><col class="w-20" /></colgroup>
                            <thead class="sticky top-0 bg-cl-EDEAEA text-cl-2B2D31">
                                <tr><th colspan="2" class="px-3 py-2 text-left font-semibold">Dialogues: pick a color for each one</th></tr>
                            </thead>
                            <tbody id="dialogueList" class="divide-y divide-cl-EDEAEA"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>

        <!-- Glass footer (normal flow, not fixed) -->
        <footer class="w-full max-w-6xl px-4 pb-4">
            <div class="grid grid-cols-[1fr_1fr] md:grid-cols-[1fr_auto_1fr] items-center gap-4 px-5 py-3 rounded-2xl border border-white/70 bg-white/40 backdrop-blur-xl shadow-[0_8px_30px_rgba(0,0,0,0.06)]">
                <img src="public/icon/android-chrome-192x192.png" alt="RSVP logo" class="justify-self-start h-8 w-8 rounded-lg" />
                <span class="hidden md:block text-center text-xs sm:text-sm font-medium text-cl-18181B">Rapid Serial Visual Presentation</span>
                <nav class="justify-self-end flex items-center gap-4 text-lg text-cl-2B2D31">
                    <a href="https://kenjirl.github.io" target="_blank" rel="noopener" aria-label="Kenji's Lore to Web Dev" class="hover:opacity-80 transition-opacity">
                        <img src="public/icon/kenjirl-favicon-32x32.png" alt="Kenji's Lore to Web Dev logo" class="justify-self-start h-5 w-5 rounded-full" />
                    </a>
                    <a href="https://github.com/" target="_blank" rel="noopener" aria-label="GitHub" class="hover:text-cl-8A8A8E transition-colors"><i class="fa-brands fa-github"></i></a>
                </nav>
            </div>
        </footer>

        <div id="settingContainerRoot"></div>
        <div id="modalRoot"></div>

        <script type="module" src="js/script.js"></script>
    </body>
</html>
